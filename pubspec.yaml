name: callx_ai
description: "CallX AI"
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  go_router: ^14.2.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.10+1
  toastification: ^3.0.3
  svg_flutter: ^0.0.1
  intl: ^0.19.0
  flutter_html: ^3.0.0
  data_table_2: 2.7.2
  dropdown_button2: ^2.3.9
  flutter_colorpicker: ^1.1.0
  file_picker: ^8.1.7
  web: ^1.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  flutter_quill: ^11.5.0
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.5.3
  dart_quill_delta: ^10.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
  fonts:
    - family: SFProText
      fonts:
        - asset: assets/fonts/SFProText-Light.ttf
          weight: 300
        - asset: assets/fonts/SFProText-Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProText-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProText-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SFProText-Bold.ttf
          weight: 700
        - asset: assets/fonts/SFProText-Heavy.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_logo.png"
  web:
    generate: true
    image_path: "assets/icons/app_logo.png"
    background_color: "#000000"
    theme_color: "#000000"
